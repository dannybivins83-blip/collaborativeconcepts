<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Redlight — Your number</title>
<meta name="theme-color" content="#0a0807" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, #1a1410 0%, #0a0807 50%, #000 100%);
    color: #f5e9d4;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px;
    gap: 32px;
  }
  .brand { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 32px; }
  .brand .dot { color: #ff6b35; }
  h1 {
    font-family: 'DM Serif Display', serif; font-style: italic; font-weight: 400;
    font-size: clamp(40px, 8vw, 72px); line-height: 1.05; max-width: 720px;
  }
  .sub { color: #88766a; font-size: 14px; line-height: 1.6; max-width: 480px; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px; font-weight: 700;
    font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase;
    border: none; cursor: pointer; text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
  }
  .btn.primary { background: #ff6b35; color: #0a0807; }
  .btn.ghost { background: transparent; color: #f5e9d4; border: 1px solid rgba(245,233,212,0.18); }
  .small { font-size: 10px; letter-spacing: 1.2px; color: #88766a; }
</style>
</head>
<body>
  <a class="brand" href="/" style="text-decoration:none; color:#f5e9d4;">redlight<span class="dot">.</span></a>
  <h1>Someone you know just calculated their time tax.</h1>
  <p class="sub">Find out how much of <em>your</em> life will be spent at red lights — and how much you can take back by just looking up.</p>
  <div class="btn-row">
    <a class="btn primary" href="/#calc">DO THE MATH →</a>
    <a class="btn ghost" href="/#join">JOIN THE BETA</a>
  </div>
  <div class="small">REDLIGHT.APP · USE ONLY WHEN PARKED OR AS A PASSENGER</div>
</body>
</html>
