  <!-- Palm tree -->
  <g transform="translate(100,810)">
    <path d="M10,0 Q8,-40 12,-100 Q14,-140 10,-170" stroke="#05152b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M10,-170 Q-30,-190 -60,-210 Q-40,-190 -22,-170" fill="#05152b"/>
    <path d="M10,-170 Q45,-190 75,-210 Q55,-190 35,-170" fill="#05152b"/>
    <path d="M10,-170 Q-12,-215 -20,-245 Q5,-215 14,-175" fill="#05152b"/>
