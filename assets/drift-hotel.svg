  <rect x="1020" y="640" width="240" height="6" fill="#7c5730" opacity="0.6"/>
  <rect x="1020" y="720" width="240" height="6" fill="#7c5730" opacity="0.6"/>
  <g fill="#ffdcbd" opacity="0.75">
