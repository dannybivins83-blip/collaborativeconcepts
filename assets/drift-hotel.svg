<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="driftSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdcb9b"/>
      <stop offset="50%" stop-color="#7c5730"/>
      <stop offset="100%" stop-color="#05152b"/>
    </linearGradient>
    <linearGradient id="driftBldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a41"/>
      <stop offset="100%" stop-color="#05152b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#driftSky)"/>
  <!-- Sun -->
  <circle cx="1200" cy="380" r="70" fill="#ffdcbd" opacity="0.8"/>
  <circle cx="1200" cy="380" r="140" fill="#ffdcbd" opacity="0.15"/>
  <!-- Ocean strip -->
  <rect y="700" width="1600" height="120" fill="#05152b"/>
  <!-- Wave lines -->
  <path d="M0,720 Q400,712 800,720 T1600,720" stroke="#ffdcbd" stroke-width="2" opacity="0.3" fill="none"/>
  <path d="M0,745 Q400,737 800,745 T1600,745" stroke="#ffdcbd" stroke-width="1" opacity="0.2" fill="none"/>
  <!-- Beach -->
  <path d="M0,820 Q400,810 800,815 T1600,810 L1600,1000 L0,1000 Z" fill="#2c1600"/>

