    <path d="M0,300 Q250,240 500,300 L500,320 Q250,260 0,320 Z" fill="#1b2a41"/>
    <!-- Floor bands / balconies -->
    <rect x="-15" y="400" width="530" height="8" fill="#7c5730" opacity="0.8"/>
    <rect x="-15" y="500" width="530" height="8" fill="#7c5730" opacity="0.8"/>
    <rect x="-15" y="600" width="530" height="8" fill="#7c5730" opacity="0.8"/>
    <rect x="-15" y="700" width="530" height="8" fill="#7c5730" opacity="0.8"/>
    <!-- Room windows lit up -->
    <g fill="#ffdcbd">
      <rect x="30" y="340" width="40" height="50" opacity="0.9"/>
      <rect x="90" y="340" width="40" height="50" opacity="0.7"/>
      <rect x="150" y="340" width="40" height="50" opacity="0.85"/>
      <rect x="210" y="340" width="40" height="50" opacity="0.6"/>
      <rect x="270" y="340" width="40" height="50" opacity="0.9"/>
      <rect x="330" y="340" width="40" height="50" opacity="0.8"/>
      <rect x="390" y="340" width="40" height="50" opacity="0.7"/>
      <rect x="450" y="340" width="40" height="50" opacity="0.9"/>

      <rect x="30" y="440" width="40" height="50" opacity="0.85"/>
      <rect x="90" y="440" width="40" height="50" opacity="0.95"/>
      <rect x="150" y="440" width="40" height="50" opacity="0.7"/>
      <rect x="210" y="440" width="40" height="50" opacity="0.9"/>
      <rect x="270" y="440" width="40" height="50" opacity="0.8"/>
      <rect x="330" y="440" width="40" height="50" opacity="0.9"/>
      <rect x="390" y="440" width="40" height="50" opacity="0.6"/>
      <rect x="450" y="440" width="40" height="50" opacity="0.85"/>

      <rect x="30" y="540" width="40" height="50" opacity="0.9"/>
      <rect x="90" y="540" width="40" height="50" opacity="0.7"/>
      <rect x="150" y="540" width="40" height="50" opacity="0.95"/>
      <rect x="210" y="540" width="40" height="50" opacity="0.8"/>
      <rect x="270" y="540" width="40" height="50" opacity="0.75"/>
      <rect x="330" y="540" width="40" height="50" opacity="0.9"/>
      <rect x="390" y="540" width="40" height="50" opacity="0.85"/>
      <rect x="450" y="540" width="40" height="50" opacity="0.7"/>

      <rect x="30" y="640" width="40" height="50" opacity="0.8"/>
      <rect x="90" y="640" width="40" height="50" opacity="0.95"/>
      <rect x="150" y="640" width="40" height="50" opacity="0.6"/>
      <rect x="210" y="640" width="40" height="50" opacity="0.9"/>
      <rect x="270" y="640" width="40" height="50" opacity="0.85"/>
      <rect x="330" y="640" width="40" height="50" opacity="0.7"/>
      <rect x="390" y="640" width="40" height="50" opacity="0.9"/>
      <rect x="450" y="640" width="40" height="50" opacity="0.8"/>

      <rect x="30" y="740" width="40" height="50" opacity="0.95"/>
      <rect x="90" y="740" width="40" height="50" opacity="0.85"/>
      <rect x="150" y="740" width="40" height="50" opacity="0.9"/>
      <rect x="210" y="740" width="40" height="50" opacity="0.75"/>
      <rect x="270" y="740" width="40" height="50" opacity="0.9"/>
      <rect x="330" y="740" width="40" height="50" opacity="0.85"/>
      <rect x="390" y="740" width="40" height="50" opacity="0.7"/>
      <rect x="450" y="740" width="40" height="50" opacity="0.95"/>
    </g>
