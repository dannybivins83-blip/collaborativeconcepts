    <path d="M8,-145 Q-25,-162 -50,-180" stroke="#05152b" stroke-width="5" fill="none"/>
    <path d="M8,-145 Q38,-162 60,-180" stroke="#05152b" stroke-width="5" fill="none"/>
    <path d="M8,-145 Q-5,-180 -15,-205" stroke="#05152b" stroke-width="5" fill="none"/>
