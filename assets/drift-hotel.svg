  <!-- Left side lower structure -->
  <rect x="200" y="550" width="280" height="250" fill="#05152b"/>
  <rect x="200" y="600" width="280" height="6" fill="#7c5730" opacity="0.6"/>
  <rect x="200" y="680" width="280" height="6" fill="#7c5730" opacity="0.6"/>
  <g fill="#ffdcbd" opacity="0.7">
