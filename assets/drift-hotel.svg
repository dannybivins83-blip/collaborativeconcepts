    <rect x="270" y="615" width="30" height="55" opacity="0.5"/>
    <rect x="320" y="615" width="30" height="55"/>
    <rect x="370" y="615" width="30" height="55" opacity="0.6"/>
    <rect x="420" y="615" width="30" height="55"/>
    <rect x="220" y="695" width="30" height="55" opacity="0.6"/>
    <rect x="270" y="695" width="30" height="55"/>
    <rect x="320" y="695" width="30" height="55" opacity="0.5"/>
    <rect x="370" y="695" width="30" height="55"/>
