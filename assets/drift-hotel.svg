    <rect x="1130" y="595" width="28" height="40"/>
    <rect x="1175" y="595" width="28" height="40" opacity="0.5"/>
    <rect x="1220" y="595" width="28" height="40"/>
    <rect x="1040" y="655" width="28" height="60"/>
    <rect x="1085" y="655" width="28" height="60" opacity="0.7"/>
    <rect x="1130" y="655" width="28" height="60"/>
    <rect x="1175" y="655" width="28" height="60" opacity="0.8"/>
    <rect x="1220" y="655" width="28" height="60"/>
