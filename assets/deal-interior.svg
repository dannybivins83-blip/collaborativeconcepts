<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f4f8"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="260" width="800" height="140" fill="#d4ecd0" opacity="0.6"/>
  <rect x="0" y="260" width="800" height="8" fill="#a8d49f" opacity="0.4"/>
  <!-- Street -->
  <rect x="0" y="340" width="800" height="60" fill="#b0b8c0" opacity="0.3"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#ffffff" stroke-width="2" stroke-dasharray="30,20" opacity="0.3"/>
  <!-- Sandy lot area -->
  <rect x="200" y="265" width="300" height="75" fill="#f5e6d3" opacity="0.5" rx="4"/>
  <!-- Lot stakes -->
  <rect x="200" y="258" width="3" height="20" fill="#d4b896"/>
  <rect x="497" y="258" width="3" height="20" fill="#d4b896"/>
  <line x1="200" y1="260" x2="500" y2="260" stroke="#d4b896" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
  <!-- "FOR SALE" sign -->
  <g transform="translate(320,230)">
    <rect x="0" y="0" width="60" height="5" fill="#7c5730"/>
    <rect x="25" y="5" width="4" height="30" fill="#7c5730"/>
    <rect x="5" y="2" width="50" height="22" fill="#ffffff" rx="2" stroke="#7c5730" stroke-width="1"/>
    <text x="30" y="16" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="600" fill="#05152b">FOR SALE</text>
  </g>
  <!-- Neighboring house left -->
  <g transform="translate(30,160)">
    <rect x="10" y="70" width="6" height="40" fill="#05152b" opacity="0.5"/>
    <rect x="70" y="70" width="6" height="40" fill="#05152b" opacity="0.5"/>
    <rect x="130" y="70" width="6" height="40" fill="#05152b" opacity="0.5"/>
    <rect x="0" y="25" width="140" height="45" fill="#1b2a41" rx="2"/>
    <polygon points="-8,25 70,0 148,25" fill="#05152b"/>
    <line x1="-8" y1="25" x2="148" y2="25" stroke="#7c5730" stroke-width="2"/>
    <rect x="12" y="34" width="20" height="18" fill="#ffdcbd" opacity="0.5" rx="1"/>
    <rect x="42" y="34" width="20" height="18" fill="#ffdcbd" opacity="0.6" rx="1"/>
    <rect x="72" y="34" width="20" height="18" fill="#ffdcbd" opacity="0.4" rx="1"/>
    <rect x="102" y="34" width="20" height="18" fill="#ffdcbd" opacity="0.5" rx="1"/>
  </g>
  <!-- Neighboring house right -->
  <g transform="translate(560,170)">
    <rect x="10" y="60" width="6" height="35" fill="#05152b" opacity="0.5"/>
    <rect x="60" y="60" width="6" height="35" fill="#05152b" opacity="0.5"/>
    <rect x="110" y="60" width="6" height="35" fill="#05152b" opacity="0.5"/>
    <rect x="0" y="22" width="120" height="38" fill="#05152b" rx="2"/>
    <polygon points="-6,22 60,0 126,22" fill="#1b2a41"/>
    <line x1="-6" y1="22" x2="126" y2="22" stroke="#fdcb9b" stroke-width="2"/>
    <rect x="10" y="30" width="18" height="16" fill="#bae6fd" opacity="0.5" rx="1"/>
    <rect x="38" y="30" width="18" height="16" fill="#bae6fd" opacity="0.6" rx="1"/>
    <rect x="66" y="30" width="18" height="16" fill="#bae6fd" opacity="0.4" rx="1"/>
    <rect x="94" y="30" width="18" height="16" fill="#bae6fd" opacity="0.5" rx="1"/>
  </g>
  <!-- Trees -->
  <g transform="translate(520,180)">
    <rect x="8" y="30" width="4" height="40" fill="#7c5730" rx="1"/>
    <circle cx="10" cy="25" r="18" fill="#0d5e6e" opacity="0.6"/>
  </g>
  <g transform="translate(185,190)">
    <rect x="6" y="25" width="4" height="35" fill="#7c5730" rx="1"/>
    <circle cx="8" cy="20" r="15" fill="#0d5e6e" opacity="0.5"/>
  </g>
  <!-- Clouds -->
  <ellipse cx="200" cy="50" rx="50" ry="18" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="230" cy="45" rx="35" ry="14" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="600" cy="65" rx="45" ry="16" fill="#ffffff" opacity="0.4"/>
  <!-- Text watermark -->
  <text x="400" y="385" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800" fill="#05152b" opacity="0.04">INTERIOR LOT</text>
</svg>