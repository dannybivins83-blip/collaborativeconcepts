<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <!-- Concrete floor -->
    <linearGradient id="concreteFloor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="30%" stop-color="#3e3e3e"/>
      <stop offset="70%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#383838"/>
    </linearGradient>
    <!-- Ceiling -->
    <linearGradient id="ceilingSlab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="100%" stop-color="#484848"/>
    </linearGradient>
    <!-- Wall surfaces -->
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <!-- Elevator door -->
    <linearGradient id="elevDoor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="48%" stop-color="#c8c8c8"/>
      <stop offset="52%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#bbb"/>
    </linearGradient>
    <!-- Fluorescent light -->
    <linearGradient id="fluoro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#e8e4d0"/>
    </linearGradient>
    <!-- Parking stripe -->
    <linearGradient id="yellowStripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <!-- Car paint variations -->
    <linearGradient id="carWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="carBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#2d4a7a"/>
    </linearGradient>
    <linearGradient id="carBlack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#8b2020"/>
    </linearGradient>
    <linearGradient id="carSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <!-- Floor reflection -->
    <radialGradient id="floorGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow -->
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- Column concrete -->
    <linearGradient id="colConcrete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="40%" stop-color="#777"/>
      <stop offset="100%" stop-color="#5a5a5a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#111"/>

  <!-- === FLOOR SLAB (isometric top) === -->
  <polygon points="700,420 1100,220 700,100 300,220" fill="url(#concreteFloor)"/>
  <!-- Floor texture lines -->
  <g opacity="0.08">
    <line x1="400" y1="220" x2="800" y2="420" stroke="#888" stroke-width="0.5"/>
    <line x1="500" y1="180" x2="900" y2="380" stroke="#888" stroke-width="0.5"/>
    <line x1="600" y1="140" x2="1000" y2="340" stroke="#888" stroke-width="0.5"/>
    <line x1="700" y1="100" x2="1100" y2="300" stroke="#888" stroke-width="0.5"/>
    <line x1="800" y1="140" x2="400" y2="340" stroke="#888" stroke-width="0.5"/>
    <line x1="900" y1="180" x2="500" y2="380" stroke="#888" stroke-width="0.5"/>
    <line x1="1000" y1="220" x2="600" y2="420" stroke="#888" stroke-width="0.5"/>
  </g>
  <!-- Floor wet reflection -->
  <polygon points="700,420 1100,220 700,100 300,220" fill="url(#floorGlow)"/>

  <!-- === LEFT WALL === -->
  <polygon points="300,220 300,520 700,720 700,420" fill="url(#wallL)"/>
  <!-- Wall panel joints -->
  <g opacity="0.1">
    <line x1="300" y1="320" x2="700" y2="520" stroke="#222" stroke-width="1"/>
    <line x1="300" y1="420" x2="700" y2="620" stroke="#222" stroke-width="1"/>
    <line x1="400" y1="270" x2="400" y2="570" stroke="#222" stroke-width="0.5"/>
    <line x1="500" y1="320" x2="500" y2="620" stroke="#222" stroke-width="0.5"/>
    <line x1="600" y1="370" x2="600" y2="670" stroke="#222" stroke-width="0.5"/>
  </g>

  <!-- === RIGHT WALL === -->
  <polygon points="1100,220 1100,520 700,720 700,420" fill="url(#wallR)"/>
  <g opacity="0.08">
    <line x1="1100" y1="320" x2="700" y2="520" stroke="#111" stroke-width="1"/>
    <line x1="1100" y1="420" x2="700" y2="620" stroke="#111" stroke-width="1"/>
    <line x1="1000" y1="270" x2="1000" y2="570" stroke="#111" stroke-width="0.5"/>
    <line x1="900" y1="320" x2="900" y2="620" stroke="#111" stroke-width="0.5"/>
    <line x1="800" y1="370" x2="800" y2="670" stroke="#111" stroke-width="0.5"/>
  </g>

  <!-- === CEILING SLAB === -->
  <polygon points="700,30 1100,130 700,230 300,130" fill="url(#ceilingSlab)" opacity="0.85"/>
  <!-- Ceiling left edge -->
  <polygon points="300,130 300,220 700,420 700,230" fill="#484848" opacity="0.4"/>
  <!-- Ceiling right edge -->
  <polygon points="1100,130 1100,220 700,420 700,230" fill="#333" opacity="0.4"/>

  <!-- === FLUORESCENT LIGHTS ON CEILING === -->
  <g opacity="0.6">
    <polygon points="440,140 480,125 530,145 490,160" fill="url(#fluoro)" opacity="0.8"/>
    <polygon points="440,140 480,125 530,145 490,160" fill="#fff" opacity="0.15"/>
    <polygon points="580,160 620,145 670,165 630,180" fill="url(#fluoro)" opacity="0.7"/>
    <polygon points="720,180 760,165 810,185 770,200" fill="url(#fluoro)" opacity="0.6"/>
    <polygon points="860,160 900,145 950,165 910,180" fill="url(#fluoro)" opacity="0.5"/>
  </g>

  <!-- === LIGHT POOLS ON FLOOR (from fluorescents) === -->
  <g opacity="0.05">
    <ellipse cx="490" cy="300" rx="60" ry="30" fill="#fff"/>
    <ellipse cx="630" cy="330" rx="60" ry="30" fill="#fff"/>
    <ellipse cx="770" cy="300" rx="60" ry="30" fill="#fff"/>
    <ellipse cx="910" cy="280" rx="50" ry="25" fill="#fff"/>
  </g>

  <!-- === PARKING LINES (yellow stripes) === -->
  <!-- Left bay stalls -->
  <g opacity="0.8">
    <line x1="385" y1="280" x2="420" y2="365" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="425" y1="268" x2="460" y2="353" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="465" y1="256" x2="500" y2="341" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="505" y1="244" x2="540" y2="329" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="545" y1="232" x2="580" y2="317" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="585" y1="220" x2="620" y2="305" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="625" y1="208" x2="660" y2="293" stroke="#c9a227" stroke-width="2.5"/>
  </g>
  <!-- Right bay stalls -->
  <g opacity="0.8">
    <line x1="760" y1="208" x2="795" y2="293" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="800" y1="220" x2="835" y2="305" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="840" y1="232" x2="875" y2="317" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="880" y1="244" x2="915" y2="329" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="920" y1="256" x2="955" y2="341" stroke="#c9a227" stroke-width="2.5"/>
    <line x1="960" y1="268" x2="995" y2="353" stroke="#c9a227" stroke-width="2.5"/>
  </g>

  <!-- === NUMBERED STALL MARKINGS === -->
  <g font-family="Inter,Arial,sans-serif" font-size="8" fill="#c9a227" opacity="0.5">
    <text x="400" y="335" transform="skewY(28)">1</text>
    <text x="440" y="323" transform="skewY(28)">2</text>
    <text x="480" y="311" transform="skewY(28)">3</text>
    <text x="520" y="299" transform="skewY(28)">4</text>
    <text x="560" y="287" transform="skewY(28)">5</text>
  </g>

  <!-- === DRIVE AISLE ARROWS === -->
  <g opacity="0.5">
    <!-- Forward arrows -->
    <polygon points="510,375 525,368 520,378" fill="#fff"/>
    <line x1="490" y1="383" x2="520" y2="372" stroke="#fff" stroke-width="1.5"/>
    <polygon points="640,345 655,338 650,348" fill="#fff"/>
    <line x1="620" y1="353" x2="650" y2="342" stroke="#fff" stroke-width="1.5"/>
    <!-- Reverse arrows -->
    <polygon points="790,375 775,368 780,378" fill="#fff"/>
    <line x1="810" y1="383" x2="780" y2="372" stroke="#fff" stroke-width="1.5"/>
    <polygon points="880,345 865,338 870,348" fill="#fff"/>
    <line x1="900" y1="353" x2="870" y2="342" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- === STRUCTURAL COLUMNS (3D concrete pillars) === -->
  <!-- Column function: top face, left face, right face -->
  <g>
    <!-- Col 1 -->
    <polygon points="370,262 385,255 395,260 380,267" fill="#777"/>
    <polygon points="370,262 370,302 380,307 380,267" fill="url(#colConcrete)"/>
    <polygon points="380,267 380,307 395,300 395,260" fill="#5a5a5a"/>
    <!-- Col 2 -->
    <polygon points="530,212 545,205 555,210 540,217" fill="#777"/>
    <polygon points="530,212 530,252 540,257 540,217" fill="url(#colConcrete)"/>
    <polygon points="540,217 540,257 555,250 555,210" fill="#5a5a5a"/>
    <!-- Col 3 -->
    <polygon points="690,212 705,205 715,210 700,217" fill="#777"/>
    <polygon points="690,212 690,252 700,257 700,217" fill="url(#colConcrete)"/>
    <polygon points="700,217 700,257 715,250 715,210" fill="#5a5a5a"/>
    <!-- Col 4 -->
    <polygon points="850,262 865,255 875,260 860,267" fill="#777"/>
    <polygon points="850,262 850,302 860,307 860,267" fill="url(#colConcrete)"/>
    <polygon points="860,267 860,307 875,300 875,260" fill="#5a5a5a"/>
    <!-- Lower row -->
    <!-- Col 5 -->
    <polygon points="450,340 465,333 475,338 460,345" fill="#777"/>
    <polygon points="450,340 450,380 460,385 460,345" fill="url(#colConcrete)"/>
    <polygon points="460,345 460,385 475,378 475,338" fill="#5a5a5a"/>
    <!-- Col 6 -->
    <polygon points="610,340 625,333 635,338 620,345" fill="#777"/>
    <polygon points="610,340 610,380 620,385 620,345" fill="url(#colConcrete)"/>
    <polygon points="620,345 620,385 635,378 635,338" fill="#5a5a5a"/>
    <!-- Col 7 -->
    <polygon points="770,340 785,333 795,338 780,345" fill="#777"/>
    <polygon points="770,340 770,380 780,385 780,345" fill="url(#colConcrete)"/>
    <polygon points="780,345 780,385 795,378 795,338" fill="#5a5a5a"/>
  </g>
  <!-- Column shadows on floor -->
  <g opacity="0.15">
    <ellipse cx="380" cy="310" rx="12" ry="6" fill="#000"/>
    <ellipse cx="540" cy="260" rx="12" ry="6" fill="#000"/>
    <ellipse cx="700" cy="260" rx="12" ry="6" fill="#000"/>
    <ellipse cx="860" cy="310" rx="12" ry="6" fill="#000"/>
  </g>

  <!-- === ELEVATOR CORES (3D boxes) === -->
  <!-- Core 1 -->
  <g>
    <polygon points="560,168 610,145 650,162 600,185" fill="#6a6a6a"/>
    <polygon points="560,168 560,230 600,253 600,185" fill="#555"/>
    <polygon points="600,185 600,253 650,230 650,162" fill="#444"/>
    <!-- Elevator doors (on left face) -->
    <polygon points="565,185 565,222 590,236 590,199" fill="url(#elevDoor)"/>
    <line x1="577" y1="192" x2="577" y2="229" stroke="#888" stroke-width="0.5"/>
    <!-- Door frame -->
    <polygon points="563,183 563,224 592,238 592,197" fill="none" stroke="#999" stroke-width="1.5"/>
    <!-- Call button -->
    <circle cx="596" cy="215" r="2" fill="#c9a227"/>
  </g>
  <!-- Core 2 -->
  <g>
    <polygon points="760,168 810,145 850,162 800,185" fill="#6a6a6a"/>
    <polygon points="760,168 760,230 800,253 800,185" fill="#555"/>
    <polygon points="800,185 800,253 850,230 850,162" fill="#444"/>
    <polygon points="765,185 765,222 790,236 790,199" fill="url(#elevDoor)"/>
    <line x1="777" y1="192" x2="777" y2="229" stroke="#888" stroke-width="0.5"/>
    <polygon points="763,183 763,224 792,238 792,197" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="796" cy="215" r="2" fill="#c9a227"/>
  </g>

  <!-- === PARKED CARS (isometric 3D) === -->
  <!-- Car 1 - White sedan (left bay) -->
  <g transform="translate(395,290)">
    <ellipse cx="18" cy="52" rx="20" ry="6" fill="#000" opacity="0.15"/>
    <polygon points="0,30 5,10 35,0 40,20 40,40 0,50" fill="url(#carWhite)"/>
    <polygon points="40,20 40,40 55,34 55,14" fill="#aaa"/>
    <polygon points="5,10 35,0 55,14 40,20" fill="#ddd"/>
    <polygon points="8,14 20,8 35,15 22,21" fill="#8ab4d0" opacity="0.7"/>
    <rect x="0" y="44" width="4" height="4" rx="1" fill="#c0392b" opacity="0.7"/>
    <rect x="36" y="34" width="4" height="4" rx="1" fill="#e8c547" opacity="0.7"/>
  </g>
  <!-- Car 2 - Blue SUV -->
  <g transform="translate(475,260)">
    <ellipse cx="20" cy="55" rx="22" ry="7" fill="#000" opacity="0.15"/>
    <polygon points="0,32 5,8 40,0 45,22 45,44 0,55" fill="url(#carBlue)"/>
    <polygon points="45,22 45,44 60,37 60,15" fill="#1f3d5e"/>
    <polygon points="5,8 40,0 60,15 45,22" fill="#5a8abb"/>
    <polygon points="9,14 22,8 40,16 26,22" fill="#8ab4d0" opacity="0.6"/>
    <rect x="0" y="48" width="4" height="4" rx="1" fill="#c0392b" opacity="0.7"/>
  </g>
  <!-- Car 3 - Black sedan -->
  <g transform="translate(555,230)">
    <ellipse cx="18" cy="52" rx="20" ry="6" fill="#000" opacity="0.2"/>
    <polygon points="0,30 5,10 35,0 40,20 40,40 0,50" fill="url(#carBlack)"/>
    <polygon points="40,20 40,40 55,34 55,14" fill="#111"/>
    <polygon points="5,10 35,0 55,14 40,20" fill="#2a2a2a"/>
    <polygon points="8,14 20,8 35,15 22,21" fill="#4a6a8a" opacity="0.5"/>
  </g>
  <!-- Car 4 - Red -->
  <g transform="translate(805,250)">
    <ellipse cx="18" cy="52" rx="20" ry="6" fill="#000" opacity="0.15"/>
    <polygon points="0,30 5,10 35,0 40,20 40,40 0,50" fill="url(#carRed)"/>
    <polygon points="40,20 40,40 55,34 55,14" fill="#6a1a1a"/>
    <polygon points="5,10 35,0 55,14 40,20" fill="#d04030"/>
    <polygon points="8,14 20,8 35,15 22,21" fill="#8ab4d0" opacity="0.5"/>
  </g>
  <!-- Car 5 - Silver -->
  <g transform="translate(885,280)">
    <ellipse cx="18" cy="52" rx="20" ry="6" fill="#000" opacity="0.15"/>
    <polygon points="0,30 5,10 35,0 40,20 40,40 0,50" fill="url(#carSilver)"/>
    <polygon points="40,20 40,40 55,34 55,14" fill="#666"/>
    <polygon points="5,10 35,0 55,14 40,20" fill="#ccc"/>
    <polygon points="8,14 20,8 35,15 22,21" fill="#8ab4d0" opacity="0.6"/>
  </g>

  <!-- === ENTRY/EXIT OPENING (left wall cutout) === -->
  <polygon points="300,380 300,480 380,520 380,420" fill="#1a1a1a"/>
  <polygon points="302,382 302,478 378,518 378,422" fill="#0d0d0d"/>
  <!-- Entry sign -->
  <polygon points="310,378 360,358 360,368 310,388" fill="#1a6b1a"/>
  <text x="325" y="378" font-family="Inter,Arial,sans-serif" font-size="7" fill="#fff" font-weight="700">ENTER</text>
  <!-- Entry arrows on ground -->
  <g opacity="0.4">
    <polygon points="340,465 355,458 350,470" fill="#1a6b1a"/>
    <polygon points="340,440 355,433 350,445" fill="#1a6b1a"/>
  </g>

  <!-- === FIRE LANE MARKINGS === -->
  <g opacity="0.4">
    <line x1="700" y1="410" x2="700" y2="470" stroke="#c0392b" stroke-width="2" stroke-dasharray="8,6"/>
  </g>

  <!-- === SPRINKLER PIPES ON CEILING === -->
  <g opacity="0.15">
    <line x1="400" y1="155" x2="1000" y2="155" stroke="#888" stroke-width="1.5"/>
    <line x1="400" y1="175" x2="1000" y2="175" stroke="#888" stroke-width="1.5"/>
    <circle cx="500" cy="155" r="3" fill="#c0392b"/>
    <circle cx="700" cy="155" r="3" fill="#c0392b"/>
    <circle cx="900" cy="155" r="3" fill="#c0392b"/>
  </g>

  <!-- === DIMENSION ANNOTATIONS === -->
  <g opacity="0.45">
    <line x1="330" y1="80" x2="1070" y2="80" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="330" y1="74" x2="330" y2="86" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="1070" y1="74" x2="1070" y2="86" stroke="#c9a227" stroke-width="0.8"/>
    <text x="700" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#e8c547" font-weight="600">230'-11"</text>
    <line x1="260" y1="230" x2="260" y2="510" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="254" y1="230" x2="266" y2="230" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="254" y1="510" x2="266" y2="510" stroke="#c9a227" stroke-width="0.8"/>
    <text x="245" y="375" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#e8c547" transform="rotate(-63,245,375)" font-weight="600">121'-5"</text>
  </g>

  <!-- === TITLE BLOCK === -->
  <rect x="80" y="660" width="500" height="180" rx="8" fill="#1a1a2e" stroke="#c9a227" stroke-width="1.5"/>
  <rect x="80" y="660" width="500" height="4" rx="2" fill="#c9a227"/>
  <text x="105" y="702" font-family="Manrope,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">LEVEL 1 — STRUCTURED PARKING</text>
  <text x="105" y="728" font-family="Inter,Arial,sans-serif" font-size="14" fill="#c9a227" font-weight="600">Federal Highway Mixed-Use Development</text>
  <text x="105" y="752" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" opacity="0.45">Old Dixie Highway &amp; N. Federal Highway · South Florida</text>
  <line x1="105" y1="768" x2="550" y2="768" stroke="#c9a227" stroke-width="0.5" opacity="0.3"/>
  <text x="105" y="790" font-family="Inter,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.35">Dual elevator cores · Two-way aisles · 20' utility easement</text>
  <text x="105" y="810" font-family="Inter,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.35">Fire suppression · ADA accessible · Ventilation system</text>
  <text x="105" y="832" font-family="Inter,Arial,sans-serif" font-size="12" fill="#c9a227" font-weight="700" opacity="0.8">LA GALA CONSTRUCTION</text>
  <text x="330" y="832" font-family="Inter,Arial,sans-serif" font-size="11" fill="#c9a227" opacity="0.5">CGC 059211</text>

  <!-- === LEGEND === -->
  <rect x="1020" y="660" width="300" height="180" rx="8" fill="#1a1a2e" stroke="#3d3d5c" stroke-width="1"/>
  <text x="1045" y="690" font-family="Inter,Arial,sans-serif" font-size="11" fill="#c9a227" font-weight="700" letter-spacing="2">LEGEND</text>
  <line x1="1045" y1="700" x2="1290" y2="700" stroke="#c9a227" stroke-width="0.3" opacity="0.3"/>
  <rect x="1045" y="714" width="14" height="10" rx="2" fill="#6a6a6a" stroke="#999" stroke-width="0.5"/>
  <text x="1070" y="724" font-family="Inter,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.55">Elevator Core</text>
  <rect x="1045" y="738" width="14" height="10" rx="1" fill="url(#colConcrete)"/>
  <text x="1070" y="748" font-family="Inter,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.55">Structural Column</text>
  <line x1="1045" y1="768" x2="1059" y2="768" stroke="#c9a227" stroke-width="2.5"/>
  <text x="1070" y="772" font-family="Inter,Arial,sans-serif" font-size="11" fill="#fff" opacity="0.55">Parking Stall</text>
