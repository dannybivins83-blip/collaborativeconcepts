<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdcbd"/>
      <stop offset="40%" stop-color="#f5a66e"/>
      <stop offset="70%" stop-color="#1a8a9e"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d5e6e"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="sun-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#ffdcbd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f5a66e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="800" cy="420" r="60" fill="#ffdcbd" opacity="0.9"/>
  <circle cx="800" cy="420" r="120" fill="#ffdcbd" opacity="0.15"/>
  <!-- Ocean -->
  <rect x="0" y="520" width="1600" height="380" fill="url(#water)"/>
  <!-- Sun reflection -->
  <rect x="760" y="520" width="80" height="380" fill="#ffdcbd" opacity="0.08" rx="40"/>
  <rect x="780" y="520" width="40" height="380" fill="#ffdcbd" opacity="0.12" rx="20"/>
  <!-- Waves -->
  <path d="M0,560 Q100,545 200,560 Q300,575 400,560 Q500,545 600,560 Q700,575 800,560 Q900,545 1000,560 Q1100,575 1200,560 Q1300,545 1400,560 Q1500,575 1600,560" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.3"/>
  <path d="M0,600 Q150,585 300,600 Q450,615 600,600 Q750,585 900,600 Q1050,615 1200,600 Q1350,585 1500,600 L1600,600" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.2"/>
  <!-- Beach/sand strip -->
  <rect x="0" y="500" width="1600" height="25" fill="#f5e6d3" opacity="0.6"/>
  <!-- House 1 - elevated on pilings (left) -->
  <g transform="translate(180,340)">
    <!-- Pilings -->
    <rect x="10" y="120" width="8" height="60" fill="#05152b" opacity="0.7"/>
    <rect x="82" y="120" width="8" height="60" fill="#05152b" opacity="0.7"/>
    <rect x="150" y="120" width="8" height="60" fill="#05152b" opacity="0.7"/>
    <!-- House body -->
    <rect x="0" y="40" width="165" height="80" fill="#05152b" rx="3"/>
    <!-- Roof -->
    <polygon points="-10,40 82,5 175,40" fill="#1b2a41"/>
    <line x1="-10" y1="40" x2="175" y2="40" stroke="#7c5730" stroke-width="3"/>
    <!-- Windows -->
    <rect x="15" y="55" width="25" height="30" fill="#ffdcbd" opacity="0.7" rx="2"/>
    <rect x="55" y="55" width="25" height="30" fill="#ffdcbd" opacity="0.5" rx="2"/>
    <rect x="95" y="55" width="25" height="30" fill="#ffdcbd" opacity="0.8" rx="2"/>
    <rect x="135" y="55" width="20" height="30" fill="#ffdcbd" opacity="0.6" rx="2"/>
  </g>
  <!-- House 2 - elevated (center-left) -->
  <g transform="translate(430,355)">
    <rect x="10" y="110" width="8" height="50" fill="#05152b" opacity="0.7"/>
    <rect x="72" y="110" width="8" height="50" fill="#05152b" opacity="0.7"/>
    <rect x="130" y="110" width="8" height="50" fill="#05152b" opacity="0.7"/>
    <rect x="0" y="45" width="145" height="65" fill="#1b2a41" rx="3"/>
    <polygon points="-8,45 72,15 153,45" fill="#05152b"/>
    <line x1="-8" y1="45" x2="153" y2="45" stroke="#fdcb9b" stroke-width="2"/>
    <rect x="12" y="58" width="22" height="25" fill="#bae6fd" opacity="0.5" rx="2"/>
    <rect x="45" y="58" width="22" height="25" fill="#bae6fd" opacity="0.7" rx="2"/>
    <rect x="80" y="58" width="22" height="25" fill="#bae6fd" opacity="0.4" rx="2"/>
    <rect x="115" y="58" width="20" height="25" fill="#bae6fd" opacity="0.6" rx="2"/>
  </g>
  <!-- House 3 - elevated (center) -->
  <g transform="translate(680,330)">
    <rect x="12" y="130" width="10" height="65" fill="#05152b" opacity="0.7"/>
    <rect x="90" y="130" width="10" height="65" fill="#05152b" opacity="0.7"/>
    <rect x="168" y="130" width="10" height="65" fill="#05152b" opacity="0.7"/>
    <rect x="0" y="40" width="190" height="90" fill="#05152b" rx="3"/>
    <polygon points="-12,40 95,0 202,40" fill="#1b2a41"/>
    <line x1="-12" y1="40" x2="202" y2="40" stroke="#7c5730" stroke-width="3"/>
    <rect x="15" y="55" width="30" height="35" fill="#ffdcbd" opacity="0.8" rx="2"/>
    <rect x="60" y="55" width="30" height="35" fill="#ffdcbd" opacity="0.5" rx="2"/>
    <rect x="105" y="55" width="30" height="35" fill="#ffdcbd" opacity="0.7" rx="2"/>
    <rect x="150" y="55" width="28" height="35" fill="#ffdcbd" opacity="0.6" rx="2"/>
  </g>
  <!-- House 4 - elevated (center-right) -->
  <g transform="translate(960,350)">
    <rect x="10" y="115" width="8" height="50" fill="#05152b" opacity="0.7"/>
    <rect x="65" y="115" width="8" height="50" fill="#05152b" opacity="0.7"/>
    <rect x="120" y="115" width="8" height="50" fill="#05152b" opacity="0.7"/>
    <rect x="0" y="50" width="135" height="65" fill="#1b2a41" rx="3"/>
    <polygon points="-8,50 67,20 143,50" fill="#05152b"/>
    <line x1="-8" y1="50" x2="143" y2="50" stroke="#fdcb9b" stroke-width="2"/>
    <rect x="12" y="62" width="20" height="25" fill="#bae6fd" opacity="0.6" rx="2"/>
    <rect x="42" y="62" width="20" height="25" fill="#bae6fd" opacity="0.4" rx="2"/>
    <rect x="72" y="62" width="20" height="25" fill="#bae6fd" opacity="0.7" rx="2"/>
    <rect x="102" y="62" width="22" height="25" fill="#bae6fd" opacity="0.5" rx="2"/>
  </g>
  <!-- House 5 - elevated (right) -->
  <g transform="translate(1200,340)">
    <rect x="10" y="120" width="8" height="55" fill="#05152b" opacity="0.7"/>
    <rect x="80" y="120" width="8" height="55" fill="#05152b" opacity="0.7"/>
    <rect x="145" y="120" width="8" height="55" fill="#05152b" opacity="0.7"/>
    <rect x="0" y="45" width="160" height="75" fill="#05152b" rx="3"/>
    <polygon points="-10,45 80,10 170,45" fill="#1b2a41"/>
    <line x1="-10" y1="45" x2="170" y2="45" stroke="#7c5730" stroke-width="3"/>
    <rect x="15" y="60" width="25" height="28" fill="#ffdcbd" opacity="0.7" rx="2"/>
    <rect x="50" y="60" width="25" height="28" fill="#ffdcbd" opacity="0.5" rx="2"/>
    <rect x="88" y="60" width="25" height="28" fill="#ffdcbd" opacity="0.8" rx="2"/>
    <rect x="125" y="60" width="22" height="28" fill="#ffdcbd" opacity="0.6" rx="2"/>
  </g>
  <!-- Palm trees -->
  <g transform="translate(120,350)">
    <rect x="0" y="60" width="6" height="110" fill="#7c5730" rx="3"/>
    <ellipse cx="3" cy="55" rx="35" ry="12" fill="#0d5e6e" opacity="0.7" transform="rotate(-25,3,55)"/>
    <ellipse cx="3" cy="55" rx="32" ry="10" fill="#0d5e6e" opacity="0.6" transform="rotate(20,3,55)"/>
    <ellipse cx="3" cy="55" rx="30" ry="10" fill="#0d5e6e" opacity="0.5" transform="rotate(-60,3,55)"/>
  </g>
  <g transform="translate(1400,360)">
    <rect x="0" y="50" width="5" height="100" fill="#7c5730" rx="3"/>
    <ellipse cx="2" cy="45" rx="30" ry="10" fill="#0d5e6e" opacity="0.7" transform="rotate(-30,2,45)"/>
    <ellipse cx="2" cy="45" rx="28" ry="9" fill="#0d5e6e" opacity="0.6" transform="rotate(25,2,45)"/>
    <ellipse cx="2" cy="45" rx="26" ry="9" fill="#0d5e6e" opacity="0.5" transform="rotate(-55,2,45)"/>
  </g>
  <!-- Seagulls -->
  <path d="M300,200 Q305,195 310,200" fill="none" stroke="#05152b" stroke-width="1.5" opacity="0.4"/>
  <path d="M350,180 Q356,174 362,180" fill="none" stroke="#05152b" stroke-width="1.5" opacity="0.3"/>
  <path d="M1250,190 Q1256,184 1262,190" fill="none" stroke="#05152b" stroke-width="1.5" opacity="0.35"/>
  <path d="M1300,210 Q1305,205 1310,210" fill="none" stroke="#05152b" stroke-width="1.2" opacity="0.3"/>
  <!-- "10" overlay text -->
  <text x="800" y="780" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="180" font-weight="800" fill="#ffffff" opacity="0.06">10 DEALS</text>
</svg>