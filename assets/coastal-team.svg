<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ctSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdcbd"/>
      <stop offset="45%" stop-color="#c4824a"/>
      <stop offset="100%" stop-color="#05152b"/>
    </linearGradient>
    <linearGradient id="ctOcean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a41"/>
      <stop offset="100%" stop-color="#05152b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#ctSky)"/>

  <!-- Sun -->
  <circle cx="400" cy="450" r="70" fill="#ffdcbd" opacity="0.9"/>
  <circle cx="400" cy="450" r="160" fill="#ffdcbd" opacity="0.18"/>

  <!-- Cloud wisps -->
  <ellipse cx="150" cy="200" rx="110" ry="8" fill="#ffdcbd" opacity="0.25"/>
  <ellipse cx="650" cy="180" rx="120" ry="9" fill="#ffdcbd" opacity="0.2"/>
  <ellipse cx="450" cy="260" rx="80" ry="6" fill="#ffdcbd" opacity="0.2"/>

  <!-- Ocean -->
  <rect y="550" width="800" height="260" fill="url(#ctOcean)"/>
  <!-- Sun reflection -->
  <ellipse cx="400" cy="555" rx="70" ry="4" fill="#ffdcbd" opacity="0.6"/>
  <rect x="396" y="555" width="8" height="200" fill="#ffdcbd" opacity="0.12"/>
  <!-- Waves -->
  <path d="M0,580 Q200,572 400,580 T800,580" stroke="#ffdcbd" stroke-width="1.5" opacity="0.35" fill="none"/>
  <path d="M0,610 Q200,602 400,610 T800,610" stroke="#ffdcbd" stroke-width="1" opacity="0.25" fill="none"/>
  <path d="M0,640 Q200,632 400,640 T800,640" stroke="#ffdcbd" stroke-width="1" opacity="0.18" fill="none"/>
  <path d="M0,680 Q200,672 400,680 T800,680" stroke="#ffdcbd" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Beach/ground -->
  <path d="M0,810 Q200,795 400,805 T800,800 L800,1000 L0,1000 Z" fill="#2c1600"/>

  <!-- Skyline of coastal properties (pipeline concept) -->
  <!-- House 1 -->
  <g>
    <rect x="60" y="720" width="90" height="90" fill="#05152b"/>
    <polygon points="55,720 105,690 155,720" fill="#1b2a41"/>
    <rect x="75" y="735" width="20" height="25" fill="#ffdcbd" opacity="0.7"/>
    <rect x="110" y="735" width="20" height="25" fill="#ffdcbd" opacity="0.85"/>
    <rect x="90" y="775" width="20" height="35" fill="#7c5730"/>
  </g>
  <!-- House 2 elevated -->
  <g>
    <rect x="200" y="760" width="4" height="50" fill="#05152b"/>
    <rect x="240" y="760" width="4" height="50" fill="#05152b"/>
    <rect x="280" y="760" width="4" height="50" fill="#05152b"/>
    <rect x="190" y="705" width="110" height="60" fill="#05152b"/>
    <rect x="185" y="700" width="120" height="8" fill="#1b2a41"/>
    <rect x="200" y="715" width="20" height="25" fill="#ffdcbd" opacity="0.9"/>
    <rect x="235" y="715" width="20" height="25" fill="#ffdcbd" opacity="0.7"/>
    <rect x="270" y="715" width="20" height="25" fill="#ffdcbd" opacity="0.85"/>
  </g>
  <!-- House 3 tall -->
  <g>
    <rect x="340" y="680" width="120" height="130" fill="#05152b"/>
    <rect x="335" y="675" width="130" height="8" fill="#1b2a41"/>
    <rect x="355" y="695" width="25" height="30" fill="#ffdcbd" opacity="0.85"/>
    <rect x="395" y="695" width="25" height="30" fill="#ffdcbd" opacity="0.6"/>
    <rect x="435" y="695" width="20" height="30" fill="#ffdcbd" opacity="0.9"/>
    <rect x="355" y="740" width="25" height="30" fill="#ffdcbd" opacity="0.7"/>
    <rect x="395" y="740" width="25" height="30" fill="#ffdcbd" opacity="0.95"/>
    <rect x="435" y="740" width="20" height="30" fill="#ffdcbd" opacity="0.8"/>
    <rect x="390" y="780" width="25" height="30" fill="#7c5730"/>
  </g>
  <!-- House 4 elevated mid -->
  <g>
    <rect x="500" y="755" width="4" height="55" fill="#05152b"/>
    <rect x="540" y="755" width="4" height="55" fill="#05152b"/>
    <rect x="580" y="755" width="4" height="55" fill="#05152b"/>
    <rect x="620" y="755" width="4" height="55" fill="#05152b"/>
    <rect x="490" y="700" width="140" height="60" fill="#05152b"/>
    <rect x="485" y="695" width="150" height="8" fill="#1b2a41"/>
    <rect x="505" y="715" width="22" height="25" fill="#ffdcbd" opacity="0.9"/>
    <rect x="540" y="715" width="22" height="25" fill="#ffdcbd" opacity="0.7"/>
    <rect x="575" y="715" width="22" height="25" fill="#ffdcbd" opacity="0.85"/>
    <rect x="610" y="715" width="18" height="25" fill="#ffdcbd" opacity="0.75"/>
  </g>
  <!-- House 5 -->
  <g>
    <rect x="670" y="740" width="90" height="70" fill="#05152b"/>
    <polygon points="665,740 715,710 765,740" fill="#1b2a41"/>
    <rect x="685" y="755" width="18" height="22" fill="#ffdcbd" opacity="0.85"/>
    <rect x="720" y="755" width="18" height="22" fill="#ffdcbd" opacity="0.7"/>
  </g>

  <!-- Palm trees -->
  <g transform="translate(20,805)">
    <path d="M6,0 Q4,-25 8,-70 Q10,-100 6,-125" stroke="#05152b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M6,-125 Q-22,-140 -40,-155" stroke="#05152b" stroke-width="4" fill="none"/>
    <path d="M6,-125 Q30,-140 48,-155" stroke="#05152b" stroke-width="4" fill="none"/>
    <path d="M6,-125 Q-5,-155 -12,-180" stroke="#05152b" stroke-width="4" fill="none"/>
    <path d="M6,-125 Q20,-155 28,-180" stroke="#05152b" stroke-width="4" fill="none"/>
  </g>
</svg>
