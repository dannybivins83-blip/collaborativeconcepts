<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdcbd"/>
      <stop offset="50%" stop-color="#f5a66e"/>
      <stop offset="100%" stop-color="#1a8a9e"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d5e6e"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <!-- Sky - golden hour -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <!-- Sun low -->
  <circle cx="400" cy="200" r="40" fill="#ffdcbd" opacity="0.8"/>
  <circle cx="400" cy="200" r="80" fill="#ffdcbd" opacity="0.12"/>
  <!-- Bay water -->
  <rect x="0" y="250" width="800" height="150" fill="url(#bay)" opacity="0.9"/>
  <!-- Sun reflection -->
  <rect x="385" y="250" width="30" height="150" fill="#ffdcbd" opacity="0.1" rx="15"/>
  <!-- Waves -->
  <path d="M0,275 Q60,267 120,275 Q180,283 240,275 Q300,267 360,275 Q420,283 480,275 Q540,267 600,275 Q660,283 720,275 Q780,267 800,275" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.3"/>
  <!-- Shore -->
  <rect x="0" y="240" width="800" height="14" fill="#f5e6d3" opacity="0.7"/>
  <!-- Large estate home -->
  <g transform="translate(150,70)">
    <!-- Pilings -->
    <rect x="20" y="120" width="10" height="55" fill="#05152b" opacity="0.6"/>
    <rect x="120" y="120" width="10" height="55" fill="#05152b" opacity="0.6"/>
    <rect x="220" y="120" width="10" height="55" fill="#05152b" opacity="0.6"/>
    <rect x="320" y="120" width="10" height="55" fill="#05152b" opacity="0.6"/>
    <!-- Main body - wider estate -->
    <rect x="5" y="40" width="340" height="80" fill="#05152b" rx="3"/>
    <!-- Roof - hip style -->
    <polygon points="-10,40 175,0 360,40" fill="#1b2a41"/>
    <line x1="-10" y1="40" x2="360" y2="40" stroke="#7c5730" stroke-width="3"/>
    <!-- Windows - premium large -->
    <rect x="20" y="52" width="40" height="30" fill="#ffdcbd" opacity="0.7" rx="2"/>
    <rect x="75" y="52" width="40" height="30" fill="#ffdcbd" opacity="0.5" rx="2"/>
    <rect x="130" y="52" width="40" height="30" fill="#ffdcbd" opacity="0.8" rx="2"/>
    <rect x="185" y="52" width="40" height="30" fill="#ffdcbd" opacity="0.6" rx="2"/>
    <rect x="240" y="52" width="40" height="30" fill="#ffdcbd" opacity="0.7" rx="2"/>
    <rect x="295" y="52" width="40" height="30" fill="#ffdcbd" opacity="0.5" rx="2"/>
    <!-- Deck railing -->
    <rect x="5" y="120" width="340" height="5" fill="#7c5730" opacity="0.7"/>
    <!-- Garage wing -->
    <rect x="360" y="60" width="80" height="60" fill="#1b2a41" rx="2"/>
    <rect x="370" y="75" width="25" height="30" fill="#05152b" opacity="0.5" rx="1"/>
    <rect x="405" y="75" width="25" height="30" fill="#05152b" opacity="0.5" rx="1"/>
  </g>
  <!-- Boat dock -->
  <rect x="580" y="235" width="100" height="6" fill="#7c5730" rx="2"/>
  <rect x="590" y="241" width="5" height="30" fill="#7c5730"/>
  <rect x="665" y="241" width="5" height="30" fill="#7c5730"/>
  <!-- Sailboat silhouette -->
  <g transform="translate(650,190)" opacity="0.3">
    <rect x="8" y="20" width="2" height="30" fill="#05152b"/>
    <polygon points="10,20 10,45 30,40" fill="#05152b"/>
    <ellipse cx="15" cy="52" rx="18" ry="5" fill="#05152b"/>
  </g>
  <!-- Landscaping -->
  <g transform="translate(60,130)">
    <rect x="0" y="50" width="5" height="75" fill="#7c5730" rx="2"/>
    <ellipse cx="2" cy="45" rx="24" ry="9" fill="#0d5e6e" opacity="0.7" transform="rotate(-25,2,45)"/>
    <ellipse cx="2" cy="45" rx="22" ry="8" fill="#0d5e6e" opacity="0.6" transform="rotate(22,2,45)"/>
    <ellipse cx="2" cy="45" rx="20" ry="7" fill="#0d5e6e" opacity="0.5" transform="rotate(-55,2,45)"/>
  </g>
  <!-- Seagulls -->
  <path d="M250,40 Q255,34 260,40" fill="none" stroke="#05152b" stroke-width="1.2" opacity="0.3"/>
  <path d="M300,55 Q304,50 308,55" fill="none" stroke="#05152b" stroke-width="1" opacity="0.25"/>
  <!-- Text watermark -->
  <text x="400" y="375" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800" fill="#ffffff" opacity="0.08">BAY POINT ESTATES</text>
</svg>