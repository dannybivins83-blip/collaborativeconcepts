<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="lg-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5730"/>
      <stop offset="100%" stop-color="#fdcb9b"/>
    </linearGradient>
  </defs>
  <!-- Accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="url(#lg-bar)"/>
  <!-- Company name -->
  <text x="16" y="58" font-family="Manrope,Arial,sans-serif" font-size="38" font-weight="800" fill="#05152b" letter-spacing="-1">La Gala</text>
  <text x="16" y="90" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#7c5730" letter-spacing="4" text-transform="uppercase">CONSTRUCTION</text>
  <!-- License badge -->
  <rect x="248" y="38" width="140" height="32" rx="16" fill="#05152b"/>
  <text x="318" y="59" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#ffdcbd" text-anchor="middle" letter-spacing="1">FL CGC 059211</text>
  <!-- Tagline -->
  <text x="16" y="112" font-family="Inter,Arial,sans-serif" font-size="12" fill="#44474d" letter-spacing="0.5">25+ Years Building South Florida</text>
</svg>